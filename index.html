<!DOCTYPE html>
<html lang='en'>
<head>
    <meta charset='UTF-8'>
    <meta name='viewport' content='width=device-width, initial-scale=1.0'>
    <title>AI-Powered Personal Finance Manager</title>
    <!-- Bootstrap CSS via CDN for quick styling -->
    <link href='https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css' rel='stylesheet'>
    <!-- Custom styles -->
    <link rel='stylesheet' href='style.css'>
    <!-- Chart.js library for charts -->
    <script src='https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js'></script>
</head>
<body class='bg-light'>
    <nav class='navbar navbar-expand-lg navbar-dark bg-primary mb-4'>
        <div class='container-fluid'>
            <span class='navbar-brand'>Finance AI</span>
            <div class='d-flex'>
                <button id='logoutBtn' class='btn btn-outline-light' style='display:none;' onclick='logoutUser()'>Logout</button>
            </div>
        </div>
    </nav>

    <div class='container' id='authSection'>
        <div class='row justify-content-center'>
            <div class='col-md-6'>
                <div class='card mb-3'>
                    <div class='card-header'>Register</div>
                    <div class='card-body'>
                        <div class='mb-3'>
                            <label for='registerUsername' class='form-label'>Username</label>
                            <input type='text' class='form-control' id='registerUsername'>
                        </div>
                        <div class='mb-3'>
                            <label for='registerPassword' class='form-label'>Password</label>
                            <input type='password' class='form-control' id='registerPassword'>
                        </div>
                        <button class='btn btn-primary' onclick='registerUser()'>Sign Up</button>
                        <div id='registerMsg' class='mt-2 text-danger'></div>
                    </div>
                </div>
                <div class='card'>
                    <div class='card-header'>Login</div>
                    <div class='card-body'>
                        <div class='mb-3'>
                            <label for='loginUsername' class='form-label'>Username</label>
                            <input type='text' class='form-control' id='loginUsername'>
                        </div>
                        <div class='mb-3'>
                            <label for='loginPassword' class='form-label'>Password</label>
                            <input type='password' class='form-control' id='loginPassword'>
                        </div>
                        <button class='btn btn-success' onclick='loginUser()'>Login</button>
                        <div id='loginMsg' class='mt-2 text-danger'></div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <div class='container' id='dashboardSection' style='display:none;'>
        <div class='row mb-4'>
            <div class='col-12'>
                <h2>Welcome, <span id='currentUserDisplay'></span>!</h2>
                <p class='text-muted'>Track your income and expenses with AI-powered categorization.</p>
            </div>
        </div>
        <div class='row mb-4'>
            <div class='col-md-4'>
                <div class='card'>
                    <div class='card-header'>Add Transaction</div>
                    <div class='card-body'>
                        <div class='mb-3'>
                            <label for='transDate' class='form-label'>Date</label>
                            <input type='date' class='form-control' id='transDate' value=''>
                        </div>
                        <div class='mb-3'>
                            <label for='transDescription' class='form-label'>Description</label>
                            <input type='text' class='form-control' id='transDescription' placeholder='e.g., Grocery shopping'>
                        </div>
                        <div class='mb-3'>
                            <label for='transAmount' class='form-label'>Amount</label>
                            <input type='number' step='0.01' class='form-control' id='transAmount'>
                        </div>
                        <div class='mb-3'>
                            <label for='transType' class='form-label'>Type</label>
                            <select class='form-select' id='transType'>
                                <option value='income'>Income</option>
                                <option value='expense' selected>Expense</option>
                            </select>
                        </div>
                        <button class='btn btn-primary' onclick='saveTransaction()'>Save</button>
                        <div id='transMsg' class='mt-2 text-success'></div>
                    </div>
                </div>
            </div>
            <div class='col-md-8'>
                <div class='card h-100'>
                    <div class='card-header'>Summary</div>
                    <div class='card-body d-flex flex-column'>
                        <canvas id='summaryChart' height='200'></canvas>
                        <div id='summaryText' class='mt-3'></div>
                    </div>
                </div>
            </div>
        </div>
        <div class='row'>
            <div class='col-12'>
                <div class='card'>
                    <div class='card-header'>Transaction History</div>
                    <div class='card-body'>
                        <table class='table table-striped' id='transactionsTable'>
                            <thead>
                                <tr>
                                    <th>Date</th>
                                    <th>Description</th>
                                    <th>Type</th>
                                    <th>Category</th>
                                    <th class='text-end'>Amount (₹)</th>
                                </tr>
                            </thead>
                            <tbody id='transactionsBody'>
                                <!-- Filled via JavaScript -->
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- App logic -->
    <script src='app.js'></script>
</body>
</html>
