# Example secrets configuration for NexusOps AI.
#
# Copy this file to `.streamlit/secrets.toml` and fill in real values when
# deploying. The `secrets.toml` file is ignored by git so your credentials
# remain secure. Streamlit makes the values available via the `st.secrets`
# dictionary.

[database]
url = "postgresql://user:password@host:5432/dbname"

[openai]
api_key = "YOUR_OPENAI_API_KEY"

[email]
smtp_host = "smtp.example.com"
smtp_port = 587
smtp_user = "user@example.com"
smtp_password = "password"
